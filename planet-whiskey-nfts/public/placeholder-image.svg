<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:0.1"/>
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0.2"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bgGradient)" stroke="#e5e7eb" stroke-width="2"/>
  
  <!-- Whiskey bottle silhouette -->
  <g transform="translate(200, 150)">
    <!-- Bottle body -->
    <path d="M-25 40 L-25 -10 L-20 -30 L-15 -40 L15 -40 L20 -30 L25 -10 L25 40 Z" 
          fill="#8b5cf6" opacity="0.3"/>
    <!-- Bottle neck -->
    <rect x="-8" y="-50" width="16" height="10" fill="#8b5cf6" opacity="0.3"/>
    <!-- Bottle cap -->
    <rect x="-10" y="-55" width="20" height="5" rx="2" fill="#8b5cf6" opacity="0.5"/>
    
    <!-- Sparkle effects -->
    <circle cx="-15" cy="-20" r="2" fill="#fbbf24" opacity="0.6"/>
    <circle cx="18" cy="0" r="1.5" fill="#fbbf24" opacity="0.4"/>
    <circle cx="-10" cy="15" r="1" fill="#fbbf24" opacity="0.5"/>
  </g>
  
  <text x="200" y="220" font-family="Arial, sans-serif" font-size="14" font-weight="600" 
        fill="#6b7280" text-anchor="middle" dominant-baseline="middle">Collection Image</text>
  <text x="200" y="240" font-family="Arial, sans-serif" font-size="11" 
        fill="#9ca3af" text-anchor="middle" dominant-baseline="middle">Loading...</text>
</svg> 