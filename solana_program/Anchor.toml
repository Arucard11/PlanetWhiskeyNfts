[toolchain]
anchor_version = "0.31.1"
package_manager = "yarn"

[features]
resolution = true
skip-lint = false

[programs.devnet]
lendingprogram = "DDy97mgfJ6pkGzF4KdaVVXpKkVFFBgn4EGdZ7EbrH5rB"
marketplaceprogram = "24Te6BFE7StHQLh3eXNUxohcfiTi5EaFa7mdLf9UQn5x"
whiskeyprogram = "2f7Dt8iuqPpkNMDzZ8f1pmQS2A2kNSZuC9ekvGAtcTjb"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/admin-keypair.json"

[workspace]
members = ["programs/solana_program", "programs/marketplaceprogram", "programs/lendingprogram"]

[scripts]
initializeAdmin = "pnpm exec ts-node ./scripts/initializeAdmin.ts"
initializeSuperAdmin = "pnpm exec ts-node ./scripts/initializeSuperAdmin.ts"
initializeDevnet = "node ./scripts/complete-devnet-initialization.js"
initializeDevnetFull = "node ./scripts/complete-devnet-initialization-full.js"
fundDevnet = "node ./scripts/fund-devnet-accounts.js"
test = "pnpm exec ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test]
startup_wait = 5000
shutdown_wait = 2000
upgradeable = false

[test.validator]
bind_address = "0.0.0.0"
url = "https://api.devnet.solana.com"
ledger = ".anchor/test-ledger"
rpc_port = 8899

[[test.validator.clone]]
address = "metaqbxxUerdq28cj1RbAWkYQm3ybzjb6a8bt518x1s"
